[project]
name = "talk3-pulsar-speaks-english"
version = "0.1.0"
description = "Talk 3 stub — Tier 2 global synthesis / full-loop demo (built in a future session)"
requires-python = ">=3.11"
dependencies = [
    "fleet-telemetry-model",
    "fleet-simulator",
    "llm-inference",
]

[tool.uv.sources]
fleet-telemetry-model = { workspace = true }
fleet-simulator = { workspace = true }
llm-inference = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk3_pulsar_speaks_english"]
