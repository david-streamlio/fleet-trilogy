[project]
name = "talk2-greenest-token"
version = "0.1.0"
description = "Talk 2 stub (built in a future session)"
requires-python = ">=3.11"
dependencies = [
    "fleet-telemetry-model",
    "fleet-simulator",
    "llm-inference",
]

[tool.uv.sources]
fleet-telemetry-model = { workspace = true }
fleet-simulator = { workspace = true }
llm-inference = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk2_greenest_token"]
