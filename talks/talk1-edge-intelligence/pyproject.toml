[project]
name = "talk1-edge-intelligence"
version = "0.1.0"
description = "Talk 1 — Tier 1 edge interpretation: pure process() plus its Pulsar adapter/Function"
requires-python = ">=3.11"
dependencies = [
    "fleet-telemetry-model",
    "llm-inference",
    "pulsar-client>=3.5",
]

[tool.uv.sources]
fleet-telemetry-model = { workspace = true }
llm-inference = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk1_edge_intelligence"]
