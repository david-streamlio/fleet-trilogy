# Tier 3 model-comparison manifest — one entry per stage-model candidate.
#
# Paths are intentionally NOT committed as real values: every model/binary path is
# env-overridable and none of these files (GGUF weights, llama.cpp build output) are
# tracked in this repo (see .gitignore). Defaults below point at where Step 3 of the
# BitNet-to-Qwen pivot actually downloaded/built things on the dev (M4) machine; override
# per-host (e.g. on the Pi 4) with the env vars named in each entry.
#
# `extra_args` are appended verbatim to the SubprocessLlmBackend command line after the
# shared `-m -p -n -t --temp` flags — this is where per-model one-shot/template flags
# (e.g. mainline llama.cpp's `-no-cnv` to disable auto chat-template/conversation mode)
# live, per docs/CANON.md's runtime-agnostic backend design.
#
# `binary_path_env` / `model_path_env` name the env vars `make compare-models` reads for
# this entry; `default_binary_path` / `default_model_path` are dev-machine fallbacks used
# only when those env vars are unset.
#
# GATE-2 RESULT (2026-09-25, 18:57 UTC) — eval-results/compare-COMP-J2D9D71YNJ-20260925T185711Z.json:
# 8 of these 9 entries are ELIMINATED (production_candidates: reject). Qwen3-8B is the
# sole PASS. Entries stay in this manifest for the historical record/re-run capability —
# see each entry's own comment below for its specific verdict, and
# docs/TALK2-OUTLINE.md's "Update — gate-2-confirmed result" section for the full table.
#
# `enabled` (default true, read by tests/model/models_manifest.py) controls whether an
# entry is part of `make compare-models` going forward. All 8 gate-2-eliminated entries
# below are set `enabled = false` — they stay in the file as a historical/re-run record,
# but no longer run by default. Flip back to `true` (or delete the line) to re-include one.

