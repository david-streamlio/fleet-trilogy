[project]
name = "fleet-telemetry-model"
version = "0.1.0"
description = "Telemetry, enrichment-card, and incident schemas + cheap-math anomaly detection + Pulsar topic names"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_telemetry_model"]
