[project]
name = "llm-inference"
version = "0.1.0"
description = "Subprocess wrapper around a llama.cpp-family CLI runtime, plus tier1/tier2 prompt templates"
requires-python = ">=3.11"
dependencies = [
    "fleet-telemetry-model",
]

[tool.uv.sources]
fleet-telemetry-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_inference"]
