[project]
name = "fleet-simulator"
version = "0.1.0"
description = "The one fleet telemetry simulator, including the Truck 47 / I-95N slowdown scenario"
requires-python = ">=3.11"
dependencies = [
    "fleet-telemetry-model",
    "pulsar-client>=3.5",
]

[tool.uv.sources]
fleet-telemetry-model = { workspace = true }

[project.scripts]
fleet-simulate = "fleet_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_simulator"]
