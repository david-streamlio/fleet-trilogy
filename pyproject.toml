[project]
name = "fleet-trilogy"
version = "0.1.0"
description = "Workspace root for the fleet-trilogy conference talks (1-bit LLMs + Apache Pulsar for connected-fleet telemetry)"
requires-python = ">=3.11"
dependencies = [
    "fleet-telemetry-model",
    "fleet-simulator",
    "llm-inference",
    "talk1-edge-intelligence",
    "talk2-greenest-token",
    "talk3-pulsar-speaks-english",
]

[tool.uv]
package = false
# `functions` is in the default set so a plain `uv sync` keeps the Pulsar Functions
# Python runtime's imports installed -- without it, every deploy/*localrun*.sh fails
# with "No module named 'google'" (see the group's own comment below).
# `inprocess` too: GlobalSynthesisFunction's llm_backend=inprocess (the Talk 3 demo)
# imports llama-cpp-python inside the localrun instance, and a plain `uv sync` would
# otherwise remove it. It's built from source (PyPI ships only an sdist): the first
# sync compiles llama.cpp, with Metal on a Mac; uv caches the build after that.
default-groups = ["dev", "functions", "inprocess"]

[tool.uv.sources]
fleet-telemetry-model = { workspace = true }
fleet-simulator = { workspace = true }
llm-inference = { workspace = true }
talk1-edge-intelligence = { workspace = true }
talk2-greenest-token = { workspace = true }
talk3-pulsar-speaks-english = { workspace = true }

[tool.uv.workspace]
members = [
    "shared/*",
    "talks/*",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
integration = [
    "testcontainers>=4.0",
]
functions = [
    # What `pulsar-admin functions localrun`'s Python instance imports
    # (protobuf, grpcio, prometheus_client, ratelimit, apache-bookkeeper-client) --
    # it runs on the .venv/bin python the deploy/*localrun*.sh scripts put on PATH.
    # Previously only installed by hand, so `uv sync` (which removes anything not
    # in the lockfile) silently broke every localrun demo; declared here instead.
    "pulsar-client[functions]>=3.5",
    # Same major as the runtime's generated *_pb2.py stubs (Protobuf 6.31.1 in Pulsar
    # 4.2.4) -- cross-major runtime support isn't guaranteed (python-instance/README.md).
    "protobuf>=6.33.6,<7",
]
rag = [
    # Eval-only, for the Edge Triage Pipeline retrieval-augmented-precedent experiment
    # (tests/model/rag_retrieval.py) -- not a dependency of any shipped talk
    # package, kept out of the default `dev` group so `uv sync` stays lean.
    "sentence-transformers>=3.0",
]
inprocess = [
    # llama.cpp inside the Python process (llm_inference.InProcessLlmBackend), so a
    # Pulsar Function loads its model once and keeps it -- see docs/CANON.md.
    "llama-cpp-python>=0.3.36",
]

[tool.pytest.ini_options]
testpaths = ["shared", "talks"]
markers = [
    "integration: requires Docker (spins up Pulsar standalone via testcontainers); run with `make test-integration`, never required for `make test`",
    "model: requires a real llama.cpp-family binary + GGUF model; auto-skips when absent; run with `make test-model`, never required for `make test`",
]
